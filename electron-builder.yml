appId: com.coquilearn.desktop
productName: CoquiLearn
copyright: CoquiLearn contributors; includes LearnHarness by Amos Blomqvist
asar: true
forceCodeSigning: true
afterSign: scripts/after-sign.cjs
npmRebuild: false
files:
  - dist/**/*
  - package.json
  - LICENSE
  - NOTICE
asarUnpack:
  - '**/*.node'
  - '**/*.dylib'
  - dist/engine/native/**
directories:
  output: release
mac:
  icon: apps/desktop/resources/CoquiLearn.icns
  category: public.app-category.education
  minimumSystemVersion: '26.0'
  identity: '-'
  hardenedRuntime: false
  binaries:
    - Contents/Resources/app.asar.unpacked/dist/engine/native/coqui-ocr
  target:
    - target: zip
      arch: arm64
    - target: dmg
      arch: arm64
  extendInfo:
    NSMicrophoneUsageDescription: CoquiLearn uses your microphone only when you start dictation.
    NSCameraUsageDescription: CoquiLearn does not use the camera.
dmg:
  title: CoquiLearn
